name: CI/CD MediNet-Core (PAC)

# Pipeline EVA02: Build, Test, Security Scan (SAST/SCA) y Continuous Deployment a AWS EC2.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # TEST: ejecuta la suite PAC contra un PostgreSQL efímero (Podman) usando el
  # runner seguro del proyecto, sin modificar el código de pruebas.
  # --------------------------------------------------------------------------
  test:
    name: Test (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Preparar imagen PostgreSQL local para el runner de pruebas
        run: podman pull docker.io/library/postgres:18-alpine

      - name: Ejecutar suite PAC (PostgreSQL efímero + pytest)
        run: python scripts/run_pac_tests.py

  # --------------------------------------------------------------------------
  # BUILD + SECURITY SCAN: construye la imagen (tag por commit), corre SAST
  # (Bandit) y SCA/imagen (Trivy), y publica la imagen como artefacto + reportes.
  # --------------------------------------------------------------------------
  build-scan:
    name: Build imagen + Security Scan (SAST/SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Construir imagen Docker (tag por commit y tag de compose)
        run: |
          docker build -f Dockerfile.local \
            -t medinet-pac:${{ github.sha }} \
            -t medinet-pac:docker-prepared-20261030 .

      - name: SAST - Bandit (análisis estático del código)
        run: |
          pip install bandit
          bandit -r app -ll -f json -o bandit-report.json || true
          bandit -r app -ll || true

      - name: SCA - Trivy sobre dependencias (requirements)
        run: |
          docker run --rm -v "$PWD:/work" -w /work aquasec/trivy:0.58.1 \
            fs --scanners vuln --severity CRITICAL,HIGH --exit-code 0 .

      - name: Trivy sobre la imagen construida
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:0.58.1 image --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            --format json -o trivy-image-report.json medinet-pac:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            medinet-pac:${{ github.sha }}

      - name: Guardar imagen para el despliegue
        run: docker save medinet-pac:docker-prepared-20261030 | gzip > image.tar.gz

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: medinet-pac-image
          path: image.tar.gz
          retention-days: 1

      - name: Subir reportes de seguridad como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            trivy-image-report.json
          retention-days: 30

  # --------------------------------------------------------------------------
  # DEPLOY: solo en push a main. Transfiere la imagen escaneada al EC2 por SSH,
  # la carga y recrea los contenedores con docker compose (migración idempotente).
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy a AWS EC2
    needs: [test, build-scan]
    # Solo se activa cuando defines la variable de repo DEPLOY_ENABLED=true
    # (después de cargar los secretos EC2_* y abrir el puerto SSH en el Security Group).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: medinet-pac-image

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Transferir imagen al EC2
        run: |
          scp -i ~/.ssh/ec2.pem image.tar.gz \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/image.tar.gz"

      - name: Cargar imagen y redesplegar
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            set -e
            gunzip -f image.tar.gz
            docker load -i image.tar
            rm -f image.tar
            cd ~/MediNet-Core
            docker compose --env-file .env.docker -f compose.docker.yml up -d db
            sleep 8
            docker compose --env-file .env.docker -f compose.docker.yml --profile tools run --rm migrate
            docker compose --env-file .env.docker -f compose.docker.yml up -d api
            docker compose --env-file .env.docker -f compose.docker.yml ps
            curl --fail --silent http://127.0.0.1:18082/health && echo " <- API OK"
          '
