name: medinet-pac-local-20261030
services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: medinet-pac-local-20261030-db
    environment:
      POSTGRES_DB: pac_local
      POSTGRES_USER: pac_local_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - source: medinet-pac-local-20261030-admin
        target: admin_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pac_local_admin -d pac_local']
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: localhost/medinet-pac:local-20261030
    container_name: medinet-pac-local-20261030-api
    environment:
      POSTGRES_DB: pac_local
      PAC_DB_USER: pac_local_api
      DB_HOST: db
      DB_PORT: "5432"
    secrets:
      - source: medinet-pac-local-20261030-api
        target: api_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
    ports: ["127.0.0.1:${PAC_LOCAL_PORT:-18081}:8000"]
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    image: localhost/medinet-pac:local-20261030
    profiles: [tools]
    command: [admin]
    environment:
      POSTGRES_DB: pac_local
      POSTGRES_USER: pac_local_admin
      PAC_DB_USER: pac_local_api
      DB_HOST: db
      DB_PORT: "5432"
    secrets:
      - source: medinet-pac-local-20261030-admin
        target: admin_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: medinet-pac-local-20261030-api
        target: api_password
        uid: "10001"
        gid: "10001"
        mode: "0400"
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  medinet-pac-local-20261030-admin:
    external: true
    name: medinet-pac-local-20261030-admin
  medinet-pac-local-20261030-api:
    external: true
    name: medinet-pac-local-20261030-api
volumes:
  pgdata:
    name: medinet-pac-local-20261030-pgdata
networks:
  frontend:
    name: medinet-pac-local-20261030-frontend
  backend:
    name: medinet-pac-local-20261030-backend
    internal: true
